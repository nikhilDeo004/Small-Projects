<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Masta ree — your personal music player.">
  <title>Masta ree ! — Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <a href="#" class="logo" aria-label="Masta ree home">Masta ree<span> !</span></a>
      <div class="header-right">
        <span class="header-label">YOUR PERSONAL MUSIC SPACE</span>
        <button id="sidebarToggle" class="sidebar-toggle-btn" type="button" aria-label="Open playlist" aria-expanded="false" aria-controls="sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          <span id="headerSongCount" class="playlist-count" aria-hidden="true">0</span>
        </button>
      </div>
    </header>

    <section class="search-section" aria-label="Search music">
      <label class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" placeholder="Search your music..." autocomplete="off" aria-keyshortcuts="/">
        <kbd class="search-shortcut">/</kbd>
      </label>
    </section>

    <section class="player-section" aria-label="Music player">
      <p class="eyebrow">NOW PLAYING</p>
      <div class="album-art" aria-hidden="true">
        <div class="album-symbol" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M39 10v34.5a9.5 9.5 0 1 1-4-7.75V19l22-5v24.5a9.5 9.5 0 1 1-4-7.75V9l-14 1Z" fill="currentColor"/></svg></div>
        <div class="album-caption">MASTA REE / AUDIO</div>
      </div>

      <div class="song-summary">
        <div class="song-info">
          <h1 id="songTitle">Select a song</h1>
          <p id="songArtist">Your music collection</p>
        </div>
        <button id="currentFavoriteBtn" class="favorite-current-btn" type="button" aria-label="Add current song to favorites" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>
          <span class="visually-hidden">Favorite this song</span>
        </button>
      </div>

      <div class="progress-section">
        <input id="progressBar" class="range" type="range" min="0" max="1000" value="0"
               aria-label="Seek through song" disabled>
        <div class="time-container">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="shuffleBtn" class="secondary-btn icon-btn" type="button" aria-label="Shuffle off" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M4 4l5 5m4 4 8 8"/></svg></button>
        <button id="prevBtn" class="control-btn icon-btn" type="button" aria-label="Previous song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6l-9 6 9 6V6Z" fill="currentColor" stroke="none"/></svg></button>
        <button id="seekBackBtn" class="seek-btn" type="button" aria-label="Back 10 seconds" title="Back 10 seconds" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 12V5m0 0 6 2M8 5l-4 5M7 13a11 11 0 1 0 3-5"/><text x="16" y="20">10</text></svg></button>
        <button id="playBtn" class="play-btn" type="button" aria-label="Play" disabled></button>
        <button id="seekForwardBtn" class="seek-btn" type="button" aria-label="Forward 10 seconds" title="Forward 10 seconds" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 12V5m0 0-6 2m6-2 4 5m-3 3a11 11 0 1 1-3-5"/><text x="16" y="20">10</text></svg></button>
        <button id="nextBtn" class="control-btn icon-btn" type="button" aria-label="Next song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l9 6-9 6V6Z" fill="currentColor" stroke="none"/></svg></button>
        <button id="repeatBtn" class="secondary-btn icon-btn" type="button" aria-label="Repeat off" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg><span class="repeat-one-mark" aria-hidden="true">1</span></button>
      </div>

      <div class="volume-section">
        <span>VOLUME</span>
        <input id="volumeBar" class="range volume-range" type="range" min="0" max="1" step="0.01" value="0.8"
               aria-label="Volume">
        <span id="volumeValue">80%</span>
      </div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <footer>
      <span>MASTA REE MUSIC PLAYER</span>
      <span>MADE FOR MUSIC.</span>
    </footer>
  </main>

  <!-- Sidebar overlay -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- Sidebar playlist -->
  <aside id="sidebar" class="sidebar" role="dialog" aria-modal="true" aria-labelledby="playlistTitle" inert>
    <div class="sidebar-header">
      <div>
        <p class="eyebrow">YOUR COLLECTION</p>
        <h2 id="playlistTitle">Your songs <span id="songCount">0</span></h2>
      </div>
      <button id="sidebarClose" class="sidebar-close-btn" type="button" aria-label="Close playlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="playlist-filters" role="group" aria-label="Filter playlist">
      <button id="allSongsFilter" class="playlist-filter active" type="button" aria-pressed="true">All <span id="allSongCount">0</span></button>
      <button id="favoritesFilter" class="playlist-filter" type="button" aria-pressed="false">Favorites <span id="favoriteCount">0</span></button>
    </div>
    <div class="device-library-actions">
      <button id="addDeviceSongsBtn" class="add-device-songs-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add from device
      </button>
      <input id="deviceSongInput" class="visually-hidden" type="file">
      <span>Saved on this device</span>
    </div>
    <div id="playlist" class="playlist" aria-live="polite"></div>
  </aside>

  <audio id="audioPlayer" preload="none"></audio>
  <script src="songs.js"></script>
  <script src="script.js"></script>
</body>
</html>
